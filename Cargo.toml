[package]
name = "innert"
version = "0.1.0"
edition = "2024"
rust-version = "1.86.0"
# The game and its model editor are each a little program over the same code, whose root stays
# at src/main.rs, see src/bin
autobins = false
# What `cargo run` starts without --bin: the game, `cargo run --release --bin innert-editor` the editor
default-run = "innert"

[lib]
name = "innert"
path = "src/main.rs"

[[bin]]
name = "innert"
path = "src/bin/innert.rs"

[[bin]]
name = "innert-editor"
path = "src/bin/innert-editor.rs"

[dependencies]
vulkano = "0.35.2"
# The same as vulkano's, for what it doesn't wrap: how much of the graphics card's memory is free
ash = "0.38.0"
winit = "0.30.12"

shaderc = "0.8.3"
egui_winit_vulkano = "0.28.0"
winit_input_helper = { git = "https://github.com/rukai/winit_input_helper", rev = "638b12fe73b8eb08ed9a8a107d554f4c3b99e8cf" }

nalgebra = { version = "0.34.0", features = ["bytemuck"] }
bytemuck = { version = "1.23.2", features = ["derive"] }

notify = "8.2.0"
ply-rs = "0.1.3"

image = "0.25.6"
crossterm = "0.29.0"

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rodio = { version = "0.20.1", default-features = false }
lewton = "0.10.2"
